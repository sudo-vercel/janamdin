<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hold On, Swara! 🎁</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400&display=swap" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #fff 0%, #f8edeb 100%);
      font-family: 'Poppins', sans-serif;
      color: #3e3232;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 8vw, 64px);
      margin-bottom: 10px;
    }
    p { font-size: 18px; color: #8f5f51; }
  </style>
</head>
<body>
  <h1>Nice try, Swara! 🙈</h1>
  <p>Your birthday gift unlocks at midnight sharp (12:00 AM) ❤️</p>
  <script>
    // Automatically reload every 10 seconds to check if midnight has passed
    setInterval(() => {
      const unlockTime = new Date('2026-08-01T00:00:00').getTime();
      if (Date.now() >= unlockTime) {
        window.location.href = 'index.html';
      }
    }, 10000);
  </script>
</body>
</html>
